[package]
name = "airpods-gnome-daemon"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Headless AirPods backend for GNOME"

[[bin]]
name = "airpods-gnome"
path = "src/main.rs"

[[bin]]
name = "airpods-gnome-ctl"
path = "src/bin/ctl.rs"

[features]
test-support = []

[dependencies]
aes = "0.8"
anyhow = "1"
bluer = { version = "0.17.4", default-features = false, features = ["l2cap"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
